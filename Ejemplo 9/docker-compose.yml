version: '3.7'

services:
  reverseproxy:
    build: ./reverse
    container_name: reverseproxy
    ports:
      - 8080:8080
      - 8081:8081
    networks:
      - mi-red
    depends_on:
      - nginx
      - apache
    restart: always

  nginx:
    build: ./site1
    container_name: nginx
    networks:
      - mi-red
    restart: always

  apache:
    build: ./site2
    container_name: apache
    networks:
      - mi-red
    restart: always

networks:
  mi-red:
    driver: bridge